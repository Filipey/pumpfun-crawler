[package]
name = "pumpfun-filter-plugin"
version = "0.1.0"
edition = "2021"
description = "Jetstreamer plugin: filters Old Faithful replay to pump.fun/PumpSwap transactions, dumps JSONL for collectors/oldfaithful_source.py"

# NOTE: version numbers pinned to match jetstreamer's own Cargo.toml (as of
# anza-xyz/jetstreamer commit at time of writing) to avoid type-mismatch
# errors from depending on a different major version of the same solana-*
# crates that TransactionData/BlockData expose fields of. If `cargo build`
# reports type mismatches on `tx.transaction.message` / `transaction_status_meta`,
# check jetstreamer's current Cargo.toml for the versions it now pins and
# match them here.
[dependencies]
jetstreamer = "0.6"
clickhouse = { version = "0.15", default-features = false }
solana-message = "3"
solana-transaction-status = "3"
solana-signature = { version = "3", default-features = false }
dashmap = "6"
once_cell = "1"
futures-util = { version = "0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
