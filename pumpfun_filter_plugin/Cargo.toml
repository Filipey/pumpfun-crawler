[package]
name = "pumpfun-filter-plugin"
version = "0.1.0"
edition = "2021"
description = "Jetstreamer plugin: filters Old Faithful replay to pump.fun/PumpSwap transactions, dumps JSONL for collectors/oldfaithful_source.py"

# NOTE: version numbers must match what jetstreamer 0.6.0 (the version
# actually published to crates.io, not its git HEAD) resolves internally, or
# cargo unifies to two separate instances of the same crate and types like
# clickhouse::Client stop matching across the Plugin trait boundary (hit this
# for real: jetstreamer-plugin pulls clickhouse 0.14.3, not 0.15.x). If
# `cargo build` reports a type mismatch on a type jetstreamer's Plugin trait
# exposes, check `grep -A2 'name = "<crate>"' Cargo.lock` for duplicate
# resolved versions and pin the exact one jetstreamer-plugin already uses.
[dependencies]
jetstreamer = "0.6"
clickhouse = { version = "=0.14.3", default-features = false }
solana-message = "3"
solana-transaction-status = "3"
solana-signature = { version = "3", default-features = false }
dashmap = "6"
once_cell = "1"
futures-util = { version = "0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
